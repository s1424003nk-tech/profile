<!DOCTYPE html>
<html lang="ja" data-theme="emerald" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィールサイト - とも</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- daisyUI CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-cyan-50 via-teal-50 to-emerald-100 min-h-screen flex flex-col justify-between antialiased">

  <!-- ナビバー -->
  <header class="sticky top-0 z-50 bg-base-100/80 backdrop-blur-md border-b border-base-200 shadow-sm">
    <div class="navbar max-w-3xl mx-auto px-4">
      <div class="flex-1">
        <a href="#" class="btn btn-ghost text-lg font-bold text-teal-700">
          <span>🐰</span> とも
        </a>
      </div>
      <div class="flex-none">
        <ul class="menu menu-horizontal px-1 font-bold text-slate-600 gap-1 text-xs sm:text-sm">
          <li><a href="#about">ひとこと</a></li>
          <li><a href="#likes">好きなもの</a></li>
          <li><a href="#learning">学び</a></li>
          <li><a href="#works">作ったもの</a></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-3xl w-full mx-auto px-4 py-8 space-y-8 flex-1">

    <!-- ヒーロー領域（ヘッダーカード） -->
    <section class="hero bg-base-100/90 backdrop-blur-md rounded-3xl shadow-xl border border-white/60 p-6 text-center">
      <div class="hero-content flex-col p-0">
        <div class="avatar">
          <div class="w-24 h-24 rounded-full ring-4 ring-teal-400 bg-teal-100 flex items-center justify-center shadow-md">
            <span class="text-5xl select-none" role="img" aria-label="うさぎ">🐰</span>
          </div>
        </div>
        <div>
          <h1 class="text-3xl font-bold text-slate-800">とも</h1>
          <p class="text-xs font-semibold text-teal-600 tracking-wider uppercase mt-1">うさぎ</p>
        </div>
      </div>
    </section>

    <!-- セクション1：ひとこと -->
    <section id="about" class="scroll-mt-20">
      <div class="card bg-base-100/90 backdrop-blur-md shadow-lg border border-white/60 rounded-3xl">
        <div class="card-body p-6">
          <h2 class="card-title text-teal-700 text-lg">
            <span>💬</span> ひとこと
          </h2>
          <div class="divider my-1"></div>
          <p class="text-xl font-bold text-slate-800 text-center py-4 bg-teal-50/60 rounded-2xl border border-teal-100">
            人生を楽しむ
          </p>
        </div>
      </div>
    </section>

    <!-- セクション2：好きなもの -->
    <section id="likes" class="scroll-mt-20">
      <div class="card bg-base-100/90 backdrop-blur-md shadow-lg border border-white/60 rounded-3xl">
        <div class="card-body p-6">
          <h2 class="card-title text-teal-700 text-lg">
            <span>❤️</span> 好きなもの
          </h2>
          <div class="divider my-1"></div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-2">
            <div class="bg-amber-50/80 border border-amber-200/60 p-4 rounded-2xl flex items-center gap-3">
              <span class="text-3xl">🍺</span>
              <div>
                <span class="badge badge-warning text-[10px] font-bold">Favorite 1</span>
                <p class="text-base font-bold text-slate-800">お酒</p>
              </div>
            </div>
            <div class="bg-emerald-50/80 border border-emerald-200/60 p-4 rounded-2xl flex items-center gap-3">
              <span class="text-3xl">🎾</span>
              <div>
                <span class="badge badge-success text-[10px] font-bold text-white">Favorite 2</span>
                <p class="text-base font-bold text-slate-800">テニス</p>
              </div>
            </div>
            <div class="bg-purple-50/80 border border-purple-200/60 p-4 rounded-2xl flex items-center gap-3">
              <span class="text-3xl">💃</span>
              <div>
                <span class="badge badge-secondary text-[10px] font-bold">Favorite 3</span>
                <p class="text-base font-bold text-slate-800">ダンス</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- セクション3：最近学んでいること -->
    <section id="learning" class="scroll-mt-20">
      <div class="card bg-base-100/90 backdrop-blur-md shadow-lg border border-white/60 rounded-3xl">
        <div class="card-body p-6">
          <h2 class="card-title text-teal-700 text-lg">
            <span>🌱</span> 最近学んでいること
          </h2>
          <div class="divider my-1"></div>
          <div class="bg-slate-50/80 p-5 rounded-2xl border border-slate-100 text-center">
            <p class="text-lg font-bold text-slate-800">
              コツコツすることが大切
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- セクション4：この授業で作ったもの -->
    <section id="works" class="scroll-mt-20">
      <div class="card bg-base-100/90 backdrop-blur-md shadow-lg border border-white/60 rounded-3xl">
        <div class="card-body p-6">
          <h2 class="card-title text-teal-700 text-lg">
            <span>🛠️</span> この授業で作ったもの
          </h2>
          <div class="divider my-1"></div>
          
          <div class="mockup-window border border-base-300 bg-base-200">
            <div class="bg-base-100 p-6 text-center space-y-2">
              <span class="badge badge-primary badge-outline font-bold text-xs">第5回 課題</span>
              <h3 class="text-lg font-bold text-slate-800">
                daisy UIの自己紹介カード（第5回）
              </h3>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer class="footer footer-center bg-base-100/80 backdrop-blur-md text-slate-600 p-4 border-t border-base-200 mt-12">
    <aside>
      <p class="font-bold text-xs">© とも 2026</p>
    </aside>
  </footer>

</body>
</html>
